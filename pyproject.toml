[project]
name = "agroguide"
version = "1.0.0"
description = "AI-powered smart farming Flask app"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.3",
    "Werkzeug>=3.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.9.0",
    "google-genai>=1.0.0"
]

[tool.vercel]
entrypoint = "run:app"