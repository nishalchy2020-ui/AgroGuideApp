<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject or "AgroGuide" }}</title>
</head>
<body style="margin:0;background:#f8fafc;font-family:Inter,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="padding:24px;background:#16a34a;color:#ffffff;">
              <div style="font-size:22px;font-weight:700;">AgroGuide</div>
              <div style="font-size:13px;opacity:.9;margin-top:4px;">Smart farming insights for healthier crops</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f1f5f9;color:#64748b;font-size:12px;line-height:1.6;">
              This email was sent by AgroGuide. If you did not request this message, you can safely ignore it unless it reports a password change.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
