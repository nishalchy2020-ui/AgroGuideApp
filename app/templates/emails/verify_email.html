{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:24px;">Verify your email</h1>
<p style="margin:0 0 18px;line-height:1.6;color:#334155;">Hi {{ user.name }}, confirm your email address to activate your AgroGuide account.</p>
<p style="margin:24px 0;">
  <a href="{{ verify_url }}" style="display:inline-block;background:#16a34a;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700;">Verify email</a>
</p>
<p style="margin:0;color:#64748b;font-size:13px;line-height:1.6;">This link expires for your security. If the button does not work, open this URL: {{ verify_url }}</p>
{% endblock %}
