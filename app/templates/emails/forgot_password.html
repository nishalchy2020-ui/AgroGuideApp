{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:24px;">Reset your password</h1>
<p style="margin:0 0 18px;line-height:1.6;color:#334155;">Hi {{ user.name }}, use the secure link below to set a new AgroGuide password. This link expires in 15 minutes.</p>
<p style="margin:24px 0;">
  <a href="{{ reset_url }}" style="display:inline-block;background:#16a34a;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700;">Reset password</a>
</p>
<p style="margin:0;color:#64748b;font-size:13px;line-height:1.6;">If you did not request this reset, ignore this email. URL: {{ reset_url }}</p>
{% endblock %}
