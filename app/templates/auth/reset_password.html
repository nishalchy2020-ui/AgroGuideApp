{% from "partials/icon.html" import icon %}
{% extends "base.html" %}
{% block title %}Reset Password - AgroGuide{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 mesh-bg">
  <div class="glass-card w-full max-w-md p-8 page-enter">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Choose a new password</h1>
      <p class="text-slate-500 text-sm mt-1">Use at least 8 characters.</p>
    </div>
    <form method="post" class="space-y-4">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div><label class="label">New password</label><input type="password" name="password" required minlength="8" class="input"></div>
      <div><label class="label">Confirm password</label><input type="password" name="confirm_password" required minlength="8" class="input"></div>
      <button type="submit" class="btn-primary w-full" data-loading>{{ icon('key-round', 'w-4 h-4') }} Reset password</button>
    </form>
  </div>
</div>
{% include "partials/flash.html" %}
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/loaders.js') }}"></script>{% endblock %}
