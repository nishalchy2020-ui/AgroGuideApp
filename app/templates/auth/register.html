{% from "partials/icon.html" import icon %}
{% extends "base.html" %}
{% block title %}Register — AgroGuide{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 mesh-bg">
  <div class="glass-card w-full max-w-md p-8 page-enter">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Create account</h1>
      <p class="text-slate-500 text-sm mt-1">Join AgroGuide</p>
    </div>
    <form method="post" class="space-y-4">
      <div><label class="label">Full name</label><input type="text" name="name" required class="input"></div>
      <div><label class="label">Email</label><input type="email" name="email" required class="input"></div>
      <div><label class="label">Password</label><input type="password" name="password" required minlength="8" class="input"></div>
      <div><label class="label">Confirm password</label><input type="password" name="confirm_password" required class="input"></div>
      <button type="submit" class="btn-primary w-full" data-loading>{{ icon('user-plus', 'w-4 h-4') }} Create account</button>
    </form>
    <p class="text-center text-sm mt-6 text-slate-500">Have an account? <a href="{{ url_for('auth.login') }}" class="text-agro-600 font-medium">Sign in</a></p>
  </div>
</div>
{% include "partials/flash.html" %}
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/loaders.js') }}"></script>{% endblock %}
