<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AgroGuide{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script>
    (() => {
      const saved = localStorage.getItem('agroguide-theme');
      if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full mesh-bg text-slate-900 dark:text-slate-100 transition-colors duration-300">
  {% block body %}{% endblock %}
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      const token = document.querySelector('meta[name="csrf-token"]')?.content;
      if (!token) return;
      document.querySelectorAll('form[method="post" i]').forEach((form) => {
        if (form.querySelector('input[name="_csrf_token"]')) return;
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = '_csrf_token';
        input.value = token;
        form.appendChild(input);
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
